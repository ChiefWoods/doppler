[package]
name = "doppler-feeder"
description = "Fetch real prices and feed them to a Doppler oracle on an interval."
repository = { workspace = true }
readme = { workspace = true }
license-file = { workspace = true }
edition = { workspace = true }
version = { workspace = true }

[dependencies]
doppler-price-source = { workspace = true }
doppler-price-source-binance = { workspace = true }
doppler-price-source-birdeye = { workspace = true }
doppler-price-source-coingecko = { workspace = true }
doppler-price-source-coinbase = { workspace = true }
doppler-price-source-http-json = { workspace = true }
doppler-price-source-jupiter = { workspace = true }
doppler-price-source-tokens-xyz = { workspace = true }
doppler-program = { workspace = true }
doppler-sdk = { workspace = true }
solana-client = { workspace = true }
solana-keypair = { workspace = true }
solana-pubkey = { workspace = true }
solana-signer = { workspace = true }

[lib]
name = "doppler_feeder"
path = "src/lib.rs"

[[bin]]
name = "feeder"
path = "src/main.rs"
